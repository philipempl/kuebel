# kuebel hell.
#
# Vier Markenfarben, mehr nicht: Graphit und Ivory tragen alles, Blau ist der
# Akzent. Lila bleibt dem Zeichen vorbehalten.
id: light
name:
  de: Hell
  en: Light
appearance: light

fonts:
  sans: '"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'
  mono: '"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace'

colors:
  background: "#FFFFFF"
  sidebar: "#F5F5F7"        # Ivory
  surface: "#FFFFFF"
  input: "#FFFFFF"
  text: "#1C1C1E"           # Graphit
  text_secondary: "#6B6B70"
  text_muted: "#A8A8AD"
  hairline: "#E4E4E7"
  accent: "#007AFF"         # Blau - alles Aktive und Hervorgehobene
  accent_text: "#F5F5F7"
  selection: "rgba(0, 122, 255, 0.14)"
  hover: "rgba(28, 28, 30, 0.05)"
  success: "#34C759"        # Systemfarbe, nicht Teil der Marke
  danger: "#FF3B30"         # Systemfarbe, nicht Teil der Marke
  overlay: "rgba(28, 28, 30, 0.20)"
  shadow: "rgba(28, 28, 30, 0.12)"

radius: 7
